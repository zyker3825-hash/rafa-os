<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran | Member Area</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #121212; /* Background netral gelap */
            padding: 20px;
        }

        .main-container {
            display: flex;
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        /* --- Sisi Laki-laki (Tegas & Bold) --- */
        .section-male {
            flex: 1;
            padding: 40px;
            background: #1a1a1a;
            color: #ffffff;
            border-right: 2px solid #333;
        }

        .section-male h2 {
            color: #ff3e3e;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-left: 5px solid #ff3e3e;
            padding-left: 10px;
            margin-bottom: 25px;
        }

        .section-male input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #252525;
            border: 1px solid #444;
            color: #fff;
            font-weight: bold;
        }

        .section-male .btn {
            width: 100%;
            padding: 15px;
            background: #ff3e3e;
            border: none;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
        }

        .section-male .btn:hover { background: #c22b2b; }

        /* --- Sisi Perempuan (Lembut & Elegan) --- */
        .section-female {
            flex: 1;
            padding: 40px;
            background: #fff5f7;
            color: #444;
        }

        .section-female h2 {
            color: #d63384;
            font-family: 'Georgia', serif;
            margin-bottom: 25px;
            text-align: right;
        }

        .section-female input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ffcad4;
            border-radius: 25px; /* Lebih membulat agar lembut */
            padding-left: 20px;
        }

        .section-female .btn {
            width: 100%;
            padding: 15px;
            background: #d63384;
            border: none;
            color: #fff;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .section-female .btn:hover { background: #b02a6b; opacity: 0.9; }

        /* Responsif untuk HP */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .section-male, .section-female { border: none; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- FORM LAKI-LAKI -->
        <div class="section-male">
            <h2>MEMBER PRIA</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: #888;">MASUKKAN DATA ANDA SEKARANG.</p>
            <form>
                <input type="text" placeholder="USERNAME" required>
                <input type="email" placeholder="EMAIL AKTIF" required>
                <input type="password" placeholder="PASSWORD" required>
                <button type="submit" class="btn">DAFTAR SEKARANG</button>
            </form>
        </div>

        <!-- FORM PEREMPUAN -->
        <div class="section-female">
            <h2>Member Wanita</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: #999; text-align: right;">Silahkan isi data diri dengan lengkap ya..</p>
            <form>
                <input type="text" placeholder="Nama Lengkap" required>
                <input type="email" placeholder="Alamat Email" required>
                <input type="password" placeholder="Kata Sandi" required>
                <button type="submit" class="btn">Bergabung Yuk</button>
            </form>
        </div>
    </div>

</body>
</html>
